<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Monthly Sheets Calculator — Final (Single Date Fix)</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">RC</div>
    <div>
      <h1>Sheets Calculator</h1>
      <div style="font-size:13px;">By <strong>Chauhan Raj Dilipbhai</strong></div>
    </div>
  </header>

  <div class="card">

    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <div style="flex:1;">
        <label>Select Month</label>
        <select id="monthSelect"></select>
      </div>
      <div style="width:120px;">
        <label>Select Day</label>
        <select id="daySelect"></select>
      </div>
      <div style="width:170px;">
        <label>Calendar</label>
        <input type="date" id="datePicker">
      </div>
      <div style="margin-top:22px;">
        <label style="display:flex;align-items:center;gap:6px;">
          <input type="checkbox" id="autoSaveCheckbox" checked> Auto-save
        </label>
      </div>
    </div>

    <label>Customer</label>
    <select id="person">
      <option value="">-- Select customer --</option>
      <option value="Atulbhai">Atulbhai</option>
      <option value="Hiteshbhai">Hiteshbhai</option>
      <option value="Kishan">Kishan</option>
    </select>

    <label>Mode</label>
    <select id="mode">
      <option value="">-- Select --</option>
      <option value="pakoda">Pakoda</option>
      <option value="sheets">Sheets</option>
    </select>

    <label>Rate (Select or Manual)</label>
    <div style="display:flex; gap:10px;">
        <select id="rate" style="flex:1;"><option value="">-- Select rate --</option></select>
        <input id="customRateInput" type="number" placeholder="Enter Price" style="display:none; flex:0.6;">
    </div>

    <label>Sheet Quantity</label>
    <input id="sheetCount" type="number" min="0" placeholder="Enter sheet Quantity">

    <label>Sheet Name</label>
    <input id="sheetName" type="text" placeholder="Enter sheet name">

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
      <button id="saveBtn" class="btn-blue" onclick="onSaveClicked()">Save Entry</button>
      <button id="cancelEditBtn" class="btn-red" onclick="cancelEdit()" style="display:none">Cancel Edit</button>
      <button class="btn-green" onclick="saveOneExcel()">Save Excel</button>
    </div>

    <div class="box" id="resultBox">No entry saved yet.</div>

    <div class="box">
      Monthly Total: <b id="monthlyTotal">0</b>
    </div>

    <label style="margin-top:14px">View Customer</label>
    <select id="viewPerson">
      <option value="Atulbhai">Atulbhai</option>
      <option value="Hiteshbhai">Hiteshbhai</option>
      <option value="Kishan">Kishan</option>
    </select>

    <label>View Month</label>
    <select id="viewMonth"></select>

    <div class="history" id="historyList">No entries.</div>

    <table>
      <thead><tr><th>Date</th><th class="right">Subtotal</th></tr></thead>
      <tbody id="dayTotalsTable"></tbody>
      <tfoot><tr><th>Total</th><th class="right" id="footerMonthlyTotal">0</th></tr></tfoot>
    </table>

    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="btn-blue" onclick="downloadMonthlyPDF()">Download PDF</button>
      <button class="btn-green" onclick="saveDailyExcelsForAll()">Daily Excel (All)</button>
      <button class="btn-red" onclick="deleteSelectedCustomerEntries()">
      Delete Selected Customer
      </button>

    </div>

  </div>
</div>
  
<script src ="script.js"></script>
</body>
</html>
